apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: jausathe-namespace

spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend-container
          image: jausathe-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits: 
              memory: "512Mi"
              cpu: "500m"

                         