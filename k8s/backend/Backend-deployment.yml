apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: jausathe-namespace

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels: 
        app: backend

      spec:
        containers:
          - name: backend_container
            image: jausathe-namespace/backend:latest
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 8080

            env:
              - name: JWT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: backend-secret    
                    key: JWT_SECRET  

            resources:
              requests: 
                memory: "256Mi"
                cpu: "250m"
              limits: 
                memory: "512Mi"
                cpu: "500m"

            livenessProbe:
              httpGet:
                  path: /health
                  port: 8080
              initialDelaySeconds: 30
              periodSeconds: 10        
          
          